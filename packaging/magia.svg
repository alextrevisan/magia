<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304a"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9dbff"/>
      <stop offset="1" stop-color="#4f7fe8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6e9bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6e9bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- glow where the wand casts -->
  <circle cx="150" cy="104" r="70" fill="url(#glow)"/>
  <!-- the wand: dark body, light tip -->
  <g transform="rotate(45 104 152)">
    <rect x="94" y="96" width="20" height="132" rx="10" fill="#0d1016" stroke="#3b4660" stroke-width="3"/>
    <rect x="94" y="96" width="20" height="30" rx="10" fill="#e8eeff"/>
  </g>
  <!-- the spell: a big four-point spark at the tip, two small ones and a dot -->
  <path d="M156 40 C160 76 172 88 208 92 C172 96 160 108 156 144 C152 108 140 96 104 92 C140 88 152 76 156 40 Z" fill="url(#spark)"/>
  <path d="M212 136 C213 148 218 153 230 154 C218 155 213 160 212 172 C211 160 206 155 194 154 C206 153 211 148 212 136 Z" fill="#8fb0ff"/>
  <path d="M86 44 C87 53 91 57 100 58 C91 59 87 63 86 72 C85 63 81 59 72 58 C81 57 85 53 86 44 Z" fill="#8fb0ff"/>
  <circle cx="196" cy="58" r="6" fill="#6e9bff"/>
</svg>
