name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting, lints, tests and the project's hard rules (no Vulkan/OpenSSL/SQLite, SSE2 baseline).
  check:
    name: check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: No Vulkan / OpenSSL / SQLite anywhere in the tree
        run: |
          for c in wgpu ash openssl aws-lc-rs rusqlite; do
            if cargo tree --workspace -i "$c" >/dev/null 2>&1; then echo "forbidden crate: $c"; exit 1; fi
          done
      - name: No CPU flags beyond the x86-64 baseline
        run: test -z "$(grep -rE 'target-cpu|target-feature|x86-64-v' .cargo Cargo.toml 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Release binaries and packages, uploaded as workflow artifacts: a .tar.gz, .deb and .rpm for
  # Linux, a .zip and an installer for Windows.
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: binaries built against glibc 2.35 also run on older distros than 24.04's would.
          - name: linux-x86_64
            os: ubuntu-22.04
            exe: ""
          - name: windows-x86_64
            os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.name }}" }
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      # Symbols are kept for the baseline check below; the binaries are stripped before packaging.
      - name: Build release binaries
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo build --release --locked -p magia-cli -p magia-gui
      # Git Bash's shell puts its own `bash` first on PATH (the bash tool and hooks need one).
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --workspace --locked
      - name: Old CPUs (SSE2 only)
        if: runner.os == 'Linux'
        run: |
          scripts/check-baseline.sh target/release/magia
          scripts/check-baseline.sh target/release/magia-gui
      - name: Package
        shell: bash
        run: |
          dir="magia-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/release/magia${{ matrix.exe }}" "target/release/magia-gui${{ matrix.exe }}" "$dir/"
          if [ "$RUNNER_OS" = Linux ]; then strip "$dir"/magia "$dir"/magia-gui; fi
          cp README.md LICENSE docs/magia.example.jsonc "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - name: .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          packaging/linux-packages.sh magia-${{ matrix.name }} .
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$version" \
            "-DSrc=..\magia-${{ matrix.name }}" "-O.." packaging/magia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: magia-${{ matrix.name }}
          path: |
            magia-${{ matrix.name }}.zip
            magia-${{ matrix.name }}.tar.gz
            magia_*.deb
            magia-*.rpm
            magia-*-setup.exe
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes a GitHub release with both packages.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Package names carry the Cargo.toml version, so the tag has to match it.
      - name: Tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag ${GITHUB_REF_NAME} != v$version (Cargo.toml)"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
