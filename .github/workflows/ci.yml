name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # No Vulkan / OpenSSL / SQLite anywhere in the tree.
      - run: |
          for c in wgpu ash openssl aws-lc-rs rusqlite; do
            if cargo tree --workspace -i "$c" >/dev/null 2>&1; then echo "forbidden crate: $c"; exit 1; fi
          done
      # CPU baseline: old CPUs (no AVX/SSE4). Fails if the toolchain/config enables more than SSE2.
      - run: |
          test -z "$(grep -rE 'target-cpu|target-feature|x86-64-v' .cargo Cargo.toml 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2
