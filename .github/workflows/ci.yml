name: ci

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting, lints, tests and the project's hard rules (no Vulkan/OpenSSL/SQLite, SSE2 baseline).
  check:
    name: check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: No Vulkan / OpenSSL / SQLite anywhere in the tree
        run: |
          # `cargo tree -i` exits 0 even when the crate is absent, so look at what it prints.
          for c in wgpu ash openssl aws-lc-rs rusqlite; do
            if cargo tree --workspace --target all -i "$c" 2>/dev/null | grep -q "^$c v"; then
              echo "forbidden crate: $c"; cargo tree --workspace --target all -i "$c"; exit 1
            fi
          done
      - name: No CPU flags beyond the x86-64 baseline
        run: test -z "$(grep -rE 'target-cpu|target-feature|x86-64-v' .cargo Cargo.toml 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Packages, uploaded as three separate workflow artifacts: .deb, .rpm and the Windows installer.
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: binaries built against glibc 2.35 also run on older distros than 24.04's would.
          - name: linux-x86_64
            os: ubuntu-22.04
            exe: ""
          - name: windows-x86_64
            os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.name }}" }
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      # Symbols are kept for the baseline check below; the binaries are stripped before packaging.
      - name: Build release binaries
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: cargo build --release --locked -p magia-cli -p magia-gui
      # Git Bash's shell puts its own `bash` first on PATH (the bash tool and hooks need one).
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --workspace --locked
      - name: Old CPUs (SSE2 only)
        if: runner.os == 'Linux'
        run: |
          scripts/check-baseline.sh target/release/magia
          scripts/check-baseline.sh target/release/magia-gui
      # Stripped copies of the binaries the packages are made from (not published on their own).
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p bin
          cp "target/release/magia${{ matrix.exe }}" "target/release/magia-gui${{ matrix.exe }}" bin/
          if [ "$RUNNER_OS" = Linux ]; then strip bin/magia bin/magia-gui; fi
      - name: .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          packaging/linux-packages.sh bin dist
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$version" \
            "-DSrc=..\bin" "-O..\dist" packaging/magia.iss
      # One artifact per package, so each user downloads only the one they need.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: magia-deb
          path: dist/magia_*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: magia-rpm
          path: dist/magia-*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: magia-windows-installer
          path: dist/magia-*-setup.exe
          if-no-files-found: error

  # Pushing a tag like v0.1.0 publishes a GitHub release with the three packages as separate files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Package names carry the Cargo.toml version, so the tag has to match it.
      - name: Tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag ${GITHUB_REF_NAME} != v$version (Cargo.toml)"; exit 1; }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
