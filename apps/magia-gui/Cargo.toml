[package]
name = "magia-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "magia-gui"
path = "src/main.rs"

[dependencies]
magia-core.workspace = true
magia-providers.workspace = true
magia-store.workspace = true
magia-tools.workspace = true
magia-types.workspace = true
anyhow.workspace = true
serde_json.workspace = true
# Clipboard images on X11; same crate and features egui-winit already uses (no new code).
# Decodes the window icon (already in the tree through magia-core).
image.workspace = true
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# default-features = false: eframe's default pulls in wgpu (Vulkan). We only want OpenGL (glow).
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.36.2"
# Not on crates.io; every fastframe crate must use the same tag. Never enable fastframe-graphics' `wgpu` feature.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-graphics = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
fastframe-notifications = { git = "https://github.com/crmne/fastframe", tag = "v0.17.0" }
futures-util.workspace = true

# The folder dialog. Linux: the desktop portal over zbus (pure Rust, already in the tree through
# fastframe; same version and features). Elsewhere: rfd, which uses the system API directly.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.18", default-features = false }

[dev-dependencies]
# Headless UI tests (no renderer, no wgpu: default features only).
egui_kittest = "0.36.2"
tempfile = "3"
